<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar-se</title>
    <link rel="stylesheet" href="css/cadastro.css">
    <link rel="shortcut icon" href="imagens/favicon.ico" type="image/x-icon">
</head>
<body>
    <div>
    <form action="Login.html" method="post">
        <h1>Cadastrar-se</h1>
        <label>
            Nome
        </label>
        <br>
        <input type="text" id="Nome" name="Nome" required>
        <br><br><br>
        <label>
            Sobrenome
        </label>
        <br>
        <input type="text" id="Sobrenome" name="Sobrenome" required>
        <br><br><br>
        <label>
            Data de Nascimento
        </label>
        <br>
        <input type="date" id="data" name="data" required>
        <br><br><br>
        <label>
            E-Mail
        </label>
        <br>
        <input type="email" id="mail" name="mail" required>
        <br><br><br>
        <label>
            Cpf
        </label>
        <br>
        <input type="text" id="Cpf" name="Cpf" required>
        <br><br><br>
        <label>
            Crie uma Senha
        </label>
        <br>
        <input type="password" id="psw" name="psw" required>
        <br><br><br>
        <label>
            Confirmar Senha
        </label>
        <br>
        <input type="password" id="cpsw" name="cpsw" required>
        <br><br>
        <input type="checkbox" id="cb1" name="cb1" value="1" required><br> Eu aceito os termos de política de privacidade informados pelo site.
        <br>
        <input type="checkbox" id="cb2" name="cb2" value="2"><br> Eu quero receber novas notificações e ofertas pelo E-mail.
        <br><br>
        <input type="submit" placeholder="Enviar" id="Enviar" name="Enviar">
        <input type="reset" id="reset" name="reset" placeholder="Redefinir">
    </form>
    </div>
</body>
</html>
