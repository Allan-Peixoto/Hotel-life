<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Life</title>
    <link rel="shortcut icon" href="imagens/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
</head>
 <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 25px 15px;
            min-height: 100vh;

            background-image: url("imagens/01_cabana_floresta_fogueira.png");
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            background-attachment: fixed;

            font-family: Arial, sans-serif;
        }

        #meia-1 {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            width: 100%;
            max-width: 900px;
            min-height: 500px;

            margin: 0 auto;
            padding: 30px 25px;

            background-color: rgba(89, 38, 9, 0.94);
            border: 3px solid #17100a;
            border-radius: 15px;
        }

        .cabecalho {
            width: 100%;
            text-align: center;
            margin-bottom: 20px;
        }

        #h1 {
            display: inline-block;
            max-width: 100%;

            padding: 12px 22px;
            margin: 0 0 15px;

            background-color: rgb(255, 233, 110);
            border-radius: 20px;

            color: #351906;
            font-size: clamp(24px, 4vw, 36px);
            overflow-wrap: break-word;
        }

        #h5 {
            display: inline-block;
            padding: 10px 20px;
            margin: 0;

            background-color: rgb(255, 240, 70);
            border-radius: 30px;

            color: #351906;
            font-size: 22px;
        }

        #carouselExampleControls {
            width: 100%;
            max-width: 600px;
            margin: 10px auto;

            border: 4px solid black;
            border-radius: 8px;
            overflow: hidden;
        }

        .carousel-inner img {
            display: block;
            width: 100%;
            height: auto;
        }

        .btn-reservar {
            width: 100%;
            max-width: 260px;
            padding: 13px 20px;

            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
        }

        .modal-content {
            border: 2px solid #592609;
            border-radius: 12px;
            overflow: hidden;
        }

        .modal-header {
            background-color: #592609;
            color: rgb(255, 233, 110);
        }

        .modal-header .btn-close {
            filter: invert(1);
        }

        .modal-body {
            padding: 22px;
        }

        .modal-body .form-select {
            width: 100%;
            min-height: 45px;
            font-size: 16px;
        }

        .modal-footer {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        @media (max-width: 768px) {
            body {
                padding: 20px 12px;
                background-attachment: scroll;
            }

            #meia-1 {
                max-width: 650px;
                padding: 25px 20px;
            }

            .carousel-inner img {
                height: 320px;
            }

            #h5 {
                font-size: 20px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 12px 8px;
            }

            #meia-1 {
                width: 100%;
                min-height: auto;
                padding: 22px 12px;
                border-width: 2px;
                border-radius: 10px;
            }

            .cabecalho {
                margin-bottom: 12px;
            }

            #h1 {
                padding: 10px 12px;
                font-size: 24px;
                border-radius: 14px;
            }

            #h5 {
                padding: 8px 16px;
                font-size: 18px;
            }

            #carouselExampleControls {
                width: 100%;
                margin: 10px auto 20px;
                border-width: 3px;
            }

            .carousel-inner img {
                height: 240px;
            }

            .btn-reservar {
                max-width: 100%;
                padding: 12px;
                font-size: 16px;
            }

            .modal-dialog {
                margin: 10px;
            }

            .modal-body {
                padding: 16px;
            }

            .modal-footer > * {
                margin: 0;
            }
        }
</style>

<body>

    <br><br><br>
    <div id="meia-1">
        <div class="132">
            <h1 id="h1">Reservar Um Quarto</h1>
            <br>
            <h5>Nossos Planos</h5>
        </div>
        <br>
        <div id="carouselExampleControls" class="carousel slide" data-bs-ride="carousel"
            style="width: 600px; align-self: center; justify-content: center; align-items: center; border: 4px solid black;">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="imagens/20.jpg" class="d-block w-100" alt="...">
                </div>
                <div class="carousel-item">
                    <img src="imagens/19.jpg" class="d-block w-100" alt="...">
                </div>
                <div class="carousel-item">
                    <img src="imagens/18.jpg" class="d-block w-100" alt="...">
                </div>
                <div class="carousel-item">
                    <img src="imagens/17.jpg" class="d-block w-100" alt="...">
                </div>
                <div class="carousel-item">
                    <img src="imagens/16.jpg" class="d-block w-100" alt="...">
                </div>
                <div class="carousel-item">
                    <img src="imagens/15.jpg" class="d-block w-100" alt="...">
                </div>
                <div class="carousel-item">
                    <img src="imagens/14.jpg" class="d-block w-100" alt="...">
                </div>
                <div class="carousel-item">
                    <img src="imagens/13.jpg" class="d-block w-100" alt="...">
                </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleControls"
                data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleControls"
                data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>
            
        </div>
        <br>
        <button type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#exampleModal">Reservar</button>
        <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="exampleModalLabel" id="h5">Reserva</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <select class="form-select" aria-label="Default select example">
  <option selected>Selecione Seu Chalé</option>

</select>

                     <option selected>Deseja Adicionar alguma atividade extra? Selecione-a aqui</option>
                     <option value="1">Tirolesa</option>
                     <option value="2">Passeio à cavalo</option>
                     <option value="3">Caiaque</option>
                     <br>
                    </select>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
        <a href="Pagamento.html"><button type="button" class="btn btn-primary">Reservar</button></a>
      </div>
    </div>
  </div>
</div>
    </div>
    <br><br>
    </div>
    
</body>

</html>
