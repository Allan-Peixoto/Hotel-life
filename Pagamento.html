<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Life</title>
    <link rel="shortcut icon" href="imagens/favicon.ico" type="image/x-icon">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
</head>
 <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 25px 15px;
            min-height: 100vh;

            text-align: center;
            font-family: Arial, sans-serif;

            background-image: url("imagens/04_sala_com_lareira.png");
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            background-attachment: fixed;
        }

        h1 {
            color: rgb(255, 211, 110);
            font-size: clamp(25px, 4vw, 36px);
            overflow-wrap: break-word;
        }

        .titulo {
            margin-bottom: 25px;
        }

        .card {
            width: 100%;
            max-width: 320px;
            margin: 0 auto;

            border: 2px solid black;
            border-radius: 10px;
            overflow: hidden;
        }

        .card-img-top {
            display: block;
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .card-body {
            color: white;
            background-color: rgb(83, 39, 8);
            font-size: 17px;
            line-height: 1.8;
        }

        .valor {
            margin: 25px auto;
            line-height: 1.5;
        }

        #a {
            display: block;
            width: 100%;
            max-width: 300px;
            height: auto;

            margin: 0 auto;

            border: 4px solid black;
            border-radius: 20px;
            background-color: white;
        }

        #btn-pago {
            display: inline-block;
            width: 100%;
            max-width: 250px;

            padding: 15px;
            margin: 25px auto;

            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            margin-right: 50px;
        }

        @media (max-width: 768px) {
            body {
                padding: 20px 15px;
                background-attachment: scroll;
            }

            .card {
                max-width: 300px;
            }

            .card-img-top {
                height: 200px;
            }

            #a {
                max-width: 270px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 15px 12px;
            }

            .titulo {
                margin-bottom: 20px;
            }

            h1 {
                font-size: 25px;
            }

            .card {
                max-width: 100%;
                width: 100%;
            }

            .card-img-top {
                height: 190px;
            }

            .card-body {
                font-size: 16px;
            }

            .valor {
                margin: 22px auto;
            }

            #a {
                max-width: min(260px, 100%);
                border-width: 3px;
                border-radius: 15px;
            }

            .btn-pago {
                max-width: 100%;
                padding: 14px;
                margin: 20px auto;
            }
        }

        @media (max-width: 320px) {
            body {
                padding: 10px 8px;
            }

            h1 {
                font-size: 22px;
            }

            .card-img-top {
                height: 165px;
            }

            .card-body {
                font-size: 14px;
            }

            #a {
                max-width: 230px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition: none !important;
            }
        }
    </style>
<body>
    <h1 style="color: rgb(255, 211, 110);">Pagamento</h1>
    <div class="card" style="width: 18rem;">
  <img src="imagens/18.jpg" class="card-img-top" alt="...">
  <div class="card-body">
    <p class="card-text">Chalé Superior <br> Tirolesa <br> Passeio à Cavalo</p>
  </div>
</div>
<h1 style="color: rgb(255, 211, 110);">Valor total <br> R$379,90</h1>
<br>
<img src="imagens/qrcode.jpg" alt="" id="a">
<br><br>
<a href="Pagamento-Confirmado.html"><button type="button" class="btn btn-warning" style="padding: 30px; margin-left: 50px;" id="btn-pago">Pago</button></a>
<br><br>
</body>
</html>
